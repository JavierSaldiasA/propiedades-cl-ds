[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "propiedades-cl-ds"
version = "0.1.0"
description = "Estimación de precios justos de propiedades en Chile"
requires-python = ">=3.11,<4"
readme = "README.md"
dependencies = [
    # Datos / ETL
    "numpy~=2.4",
    "pandas~=3.0",
    "pyarrow~=24.0",

    # Scraping (Playwright como fallback opcional, ver [project.optional-dependencies].scraping)
    "beautifulsoup4~=4.15",

    # Indicadores económicos
    "bcchapi~=1.1",

    # Visualización
    "plotly~=7.0",

    # Base de datos: Supabase Postgres con queries directas
    "psycopg[binary]~=3.3",

    # API
    "fastapi~=0.140",
    "uvicorn[standard]~=0.51",
    "pydantic~=2.13",
    "pydantic-settings~=2.14",

    # Modelos (y serialización del setup + modelo)
    "scikit-learn~=1.9",
    "lightgbm~=4.7",
    "xgboost~=3.3",
    "shap~=0.52",
    "joblib~=1.5",
    "cloudpickle~=3.1",

    # Frontend
    "streamlit~=1.60",

    # Cliente HTTP (Streamlit → API, y tests de endpoints con TestClient)
    "httpx~=0.28",
]

[project.optional-dependencies]
scraping = [
    # Fallback ante anti-bot de los portales (requiere `playwright install chromium`)
    "playwright~=1.61",
]
dev = [
    "pytest~=9.1",
    "pytest-cov~=6.0",
    "black~=26.5",
    "ruff~=0.16",
    "pre-commit~=4.2",
    "ipykernel~=7.3",
    "matplotlib~=3.11",
    "seaborn~=0.13",
]

[tool.setuptools.packages.find]
include = ["src*", "api*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: orden de imports (reemplaza isort)
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/**/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
