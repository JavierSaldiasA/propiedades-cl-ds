[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "propiedades-cl-ds"
version = "0.1.0"
description = "Estimación de precios justos de propiedades en Chile"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.black]
line-length = 88

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: orden de imports (reemplaza isort)
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
